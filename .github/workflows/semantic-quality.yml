name: Semantic quality (real model)
# Artifacts: Forgejo's fork of the v4 artifact actions (see the note in verify.yml).
on:
  push:
    branches: [main, 'work/review-20260910']
    paths: ['tools/embeddings/evaluate.py', '.github/workflows/semantic-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers==3.4.1 transformers==4.49.0
      - name: Evaluate actual multilingual embeddings with the production ranker
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
        run: python tools/embeddings/evaluate.py
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: semantic-quality
          path: test-results/semantic-quality.json
          retention-days: 14
