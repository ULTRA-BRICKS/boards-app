name: Verify
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test committed source
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/node-tests.log
      - run: npm run build && npm run build:type
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.63.0
      - run: python tests/font.py
      - name: Source snapshot for reproducible review
        if: always()
        run: git archive --format=tar HEAD > test-results/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-and-test-results
          path: test-results/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Native browser against actual HTTP servers
        shell: bash
        run: |
          mkdir -p test-results
          LOCAL_TEST_MODE=1 node scripts/dev.mjs >test-results/board-server.log 2>&1 &
          node scripts/type-server.mjs >test-results/type-server.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS http://127.0.0.1:5173/api/status >/dev/null && break; sleep 1; done
          set -o pipefail
          python tests/browser.py 2>&1 | tee test-results/browser.log
          python tests/browser-review.py 2>&1 | tee test-results/browser-review.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            docs/browser-verification.json
            test-results/
          retention-days: 14
  publish-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/browser-evidence
      - name: Publish fixture screenshots without changing main
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/browser-evidence
        run: bash scripts/publish-evidence.sh
