<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Your notebook</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"https://rawcdn.githack.com/ultrabricks/boards-app/0fa587120fbcea53e8c3f805ebec925afcd626ce/packages/":"./packages/"}}</script>
<style>
:root{--heading-weight:800;--body-weight:520;--width:100}button,select,input,textarea{font:inherit}#status{position:relative;margin:0 30px 20px;left:0;font-size:13px;background:var(--paper);z-index:21;max-width:70vw}.task-actions{max-width:none;flex-wrap:nowrap;gap:0;isolation:isolate}.avatar-button{z-index:var(--order)}.avatar-button+.avatar-button{margin-left:-9px}.avatar-button:hover,.avatar-button:focus{z-index:30;transform:translateY(-2px)}.avatar{border:2px solid var(--paper);outline:0}.task-actions .add-person{right:-27px}.column h1{white-space:normal;overflow-wrap:anywhere}.draft-title:empty:before,[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--muted)}.page-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}.page-thumb{min-height:150px;border:1px solid var(--rule);border-radius:4px 8px 5px 9px;padding:15px;box-shadow:3px 5px 0 #dde1e577;text-align:left;transform:rotate(-1deg);display:grid;gap:9px}.page-thumb:nth-child(even){transform:rotate(1deg)}.page-thumb small{font-size:15px;color:var(--muted);overflow:hidden;line-height:1.6;max-height:80px}.page-thumb.new{border-style:dashed;text-align:center;font-size:35px}.quick-actions{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px}.prototype-note{font-size:16px;color:var(--muted);line-height:1.5}.column .add-item{opacity:.45}.task.selected{background:#dce6df88}.mini-link{font-size:14px;text-decoration:underline}.peek{position:fixed;z-index:50;padding:14px 18px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;font-size:17px;max-width:300px;box-shadow:0 10px 40px #283f6018}.empty-column button{border:1px dashed var(--muted);padding:60px;font-size:35px}.share-snapshot{width:100%;border:1px solid var(--rule);margin:20px 0}.conflict{position:fixed;inset:0;z-index:100;background:#f8f6f0f5;padding:10vh max(20px,15vw);line-height:1.6}.column-title:focus,.task-text:focus{outline:1px dashed var(--rule);outline-offset:4px}.search-result{display:block;text-align:left;width:100%;border-bottom:1px solid #aab8cb55}.search-result small{display:block;font-size:14px}.task.neighbor{opacity:.35}.new-column{font-size:18px;min-height:44px;opacity:.5}.column-tabs{display:none}@media(max-width:700px){.task-actions{max-width:78px}.task-actions .avatar-button{width:26px}.task-text{font-size:23px}.column h1{font-size:65px}.page-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.page-thumb{min-height:145px;padding:10px;font-size:19px}.page-thumb small{font-size:12px}.column-tabs{display:flex;overflow:auto;gap:6px;position:sticky;top:0;z-index:10;background:#f8f6f0ed;padding:8px 0}.column-tabs button{font-size:15px;white-space:nowrap;border:1px dashed var(--rule);border-radius:6px;min-height:36px}.column{scroll-margin-top:60px}#status{font-size:12px;margin-bottom:100px}.add-person{opacity:.7}}
</style></head><body><main id="app"><section class="gate"><h1>Opening your notebook…</h1><p>Connecting to the cloud.</p></section></main><div id="overlays"></div><p id="status" role="status" aria-live="polite"></p><script type="module">import('./app.mjs').catch(()=>{document.getElementById('app').innerHTML='<section class="gate"><h1>This page could not load.</h1><p>Check your connection, then reload. No data was changed.</p><button onclick="location.reload()">Reload</button></section>'})</script></body></html>
